name: Security-Sandbox

on:
  push:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build application image
        run: docker build -t myapp:latest .

      - name: Install Semgrep & ZAP
        run: |
          pip install semgrep
          sudo apt-get update && sudo apt-get install -y owasp-zap

      - name: Run Security Sandbox
        run: python sandbox_controller.py

      - name: Upload Reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: reports/
