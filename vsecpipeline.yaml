name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Python Backend & Sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn flask flask-cors joblib

      - name: Lint Python code
        run: |
          pip install flake8
          flake8 api_server.py demo.py digital_twin_simulator.py \
                 ml_threat_detector.py security_sandbox.py

      - name: Run demo proof-of-concept
        run: |
          python demo.py

      - name: Start API server tests
        run: |
          # start API server in background
          nohup python api_server.py &>/dev/null &
          sleep 5
          # check status endpoint
          curl --fail http://127.0.0.1:5000/api/sandbox/status

  frontend:
    name: React Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        working-directory: .
        run: |
          npm ci

      - name: Lint JSX
        run: |
          npm install --save-dev eslint eslint-plugin-react
          npx eslint ThreatMonitoringDashboard.jsx

      - name: Build React app
        run: |
          npm run build

      - name: Test React app bundle
        run: |
          # verify build folder exists and index.html is present
          test -f build/index.html

